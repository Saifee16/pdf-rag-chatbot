name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Install local OCR engine
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=app \
            --cov=evaluation \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

  evaluation-regression:
    name: Retrieval Evaluation Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Install local OCR engine
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
      - name: Run deterministic V2 benchmark and abstention regression
        run: |
          python -m evaluation.run_retrieval_benchmark \
            --iterations 20 \
            --check-regression
      - name: Run local OCR integration benchmark
        run: |
          python -m evaluation.run_ocr_benchmark \
            --real-ocr \
            --output /tmp/ocr-benchmark.json

  migrations:
    name: Migration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Upgrade and downgrade schema
        env:
          DATABASE_URL: sqlite:///./migration-smoke.db
        run: |
          alembic upgrade head
          alembic downgrade base

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create CI environment file
        run: cp .env.example .env
      - run: docker compose config --quiet

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag pdf-rag-chatbot:ci .

  integration:
    name: Compose Integration Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create synthetic CI environment
        run: cp .env.example .env
      - name: Start the Compose stack
        run: docker compose --project-name pdf-rag-chatbot-ci up --detach --build
      - name: Verify health and migrations
        run: |
          for service in api worker db redis qdrant; do
            docker compose --project-name pdf-rag-chatbot-ci ps --status running --services | grep -qx "$service"
          done
          curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/api/v1/health
          docker compose --project-name pdf-rag-chatbot-ci exec -T api alembic upgrade head
      - name: Collect service diagnostics on failure
        if: failure()
        run: docker compose --project-name pdf-rag-chatbot-ci ps --all && docker compose --project-name pdf-rag-chatbot-ci logs --no-color
      - name: Tear down the stack
        if: always()
        run: docker compose --project-name pdf-rag-chatbot-ci down --volumes --remove-orphans
