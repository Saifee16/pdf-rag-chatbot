name: Feature request
description: Propose a reusable RAG capability
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reusable problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: reindex
    attributes:
      label: Index compatibility
      description: Would existing documents require reindexing? Why?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
