[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "anyio: run async tests with AnyIO",
]

[tool.coverage.run]
source = ["app", "evaluation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions", "docs", "NOTES.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
